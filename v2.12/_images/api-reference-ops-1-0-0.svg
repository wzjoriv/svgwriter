<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40" version="1.1">
  <style id="sb86088-svgwriter-theme" type="text/css">.sb86088-role-filter-shadow { flood-color:#1f2933;flood-opacity:0.2 }</style>
  <defs>
    <filter id="sb86088-filter1" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="sb86088-feGaussianBlur1" in="SourceAlpha" stdDeviation="2" result="feGaussianBlur1-out"/>
      <feOffset id="sb86088-feOffset1" in="feGaussianBlur1-out" dx="2" dy="2" result="feOffset1-out"/>
      <feFlood id="sb86088-feFlood1" flood-opacity="1" flood-color="rgba(0,0,0,0.35)" class="sb86088-role-filter-shadow" result="feFlood1-out"/>
      <feComposite id="sb86088-feComposite1" in="feFlood1-out" in2="feOffset1-out" operator="in" result="feComposite1-out"/>
      <feMerge>
        <feMergeNode in="feComposite1-out"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="30" height="30" fill="crimson" style="fill:none;stroke:#0ea5e9;stroke-width:0.133333px"/>
  <text x="45" y="28" font-size="20" style="fill:none;stroke:#0ea5e9;stroke-width:0.133333px">Hi</text>
</svg>
