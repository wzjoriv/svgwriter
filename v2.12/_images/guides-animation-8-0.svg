<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" version="1.1">
  <circle cx="20" cy="40" r="6" fill="teal">
    <animateTransform attributeName="transform" from="0 0" to="0 -12" additive="sum" begin="0s" dur="0.5s" fill="freeze" type="translate"/>
    <animateTransform attributeName="transform" from="0 0" to="0 12" additive="sum" begin="0.5s" dur="0.5s" fill="freeze" type="translate"/>
    <animate attributeName="opacity" from="1" to="0" begin="1s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" from="0 0" to="0 -8" additive="sum" begin="2s" dur="0.5s" fill="freeze" type="translate"/>
    <animateTransform attributeName="transform" from="0 0" to="0 8" additive="sum" begin="2.5s" dur="0.5s" fill="freeze" type="translate"/>
  </circle>
  <g>
    <circle cx="20" cy="80" r="6" fill="tomato">
      <animateTransform attributeName="transform" from="0 0" to="0 -6" additive="sum" begin="0s" dur="0.5s" fill="freeze" type="translate"/>
      <animateTransform attributeName="transform" from="0 0" to="0 6" additive="sum" begin="0.5s" dur="0.5s" fill="freeze" type="translate"/>
    </circle>
    <circle cx="40" cy="80" r="6" fill="tomato">
      <animateTransform attributeName="transform" from="0 0" to="0 -6" additive="sum" begin="0.2s" dur="0.5s" fill="freeze" type="translate"/>
      <animateTransform attributeName="transform" from="0 0" to="0 6" additive="sum" begin="0.7s" dur="0.5s" fill="freeze" type="translate"/>
    </circle>
    <circle cx="60" cy="80" r="6" fill="tomato">
      <animateTransform attributeName="transform" from="0 0" to="0 -6" additive="sum" begin="0.4s" dur="0.5s" fill="freeze" type="translate"/>
      <animateTransform attributeName="transform" from="0 0" to="0 6" additive="sum" begin="0.9s" dur="0.5s" fill="freeze" type="translate"/>
    </circle>
    <circle cx="80" cy="80" r="6" fill="tomato">
      <animateTransform attributeName="transform" from="0 0" to="0 -6" additive="sum" begin="0.6s" dur="0.5s" fill="freeze" type="translate"/>
      <animateTransform attributeName="transform" from="0 0" to="0 6" additive="sum" begin="1.1s" dur="0.5s" fill="freeze" type="translate"/>
    </circle>
  </g>
</svg>
