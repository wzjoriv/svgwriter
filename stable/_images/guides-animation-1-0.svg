<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" version="1.1">
  <rect x="30" y="30" width="40" height="40" rx="6" fill="none" stroke="#ccc"/>
  <rect x="30" y="30" width="40" height="40" rx="6" fill="teal">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" from="0 50 50" to="360 50 50" additive="sum" begin="0.5s" dur="2s" fill="freeze" type="rotate"/>
  </rect>
</svg>
