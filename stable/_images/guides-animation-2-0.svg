<svg xmlns="http://www.w3.org/2000/svg" width="110" height="100" viewBox="0 0 110 100" version="1.1">
  <rect x="20" y="20" width="30" height="60" fill="#ddd"/>
  <rect x="20" y="20" width="30" height="60" fill="sienna">
    <animateTransform attributeName="transform" from="0 20 50" to="-30 20 50" additive="sum" begin="0s" dur="1s" fill="freeze" type="rotate"/>
  </rect>
  <rect x="78" y="20" width="4" height="40" fill="crimson" transform="rotate(45 80 60)">
    <animateTransform attributeName="transform" from="0 80 60" to="360 80 60" additive="sum" begin="0s" dur="4s" repeatCount="indefinite" fill="freeze" type="rotate"/>
  </rect>
</svg>
