name: Build and publish

# svgwriter is pure Python: one sdist and one universal wheel (skia-python, numpy and uharfbuzz bring
# their own binary wheels). The Inkscape extension in plugins/inkscape is attached to the release as a zip. Publishing uses the PYPI_API_TOKEN secret when set, otherwise PyPI
# trusted publishing (environment `pypi`).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: System libraries for skia
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 fonts-dejavu-core
      - name: Generate stubs
        run: |
          python -m pip install -e . stubpy typer "tomli; python_version < '3.11'"
          python scripts/dev.py stub generate
      - name: Build
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check --strict dist/*
      - name: Wheel ships a stub for every module
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import pathlib, svgwriter; root = pathlib.Path(svgwriter.__file__).parent; missing = [str(p.relative_to(root)) for p in root.rglob('*.py') if not p.with_suffix('.pyi').exists()]; assert not missing, f'stubs missing: {missing}'"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  inkscape:
    name: Inkscape extension zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Zip plugins/inkscape
        run: cd plugins/inkscape && zip -r "$RUNNER_TEMP/svgwriter-inkscape.zip" . -x "__pycache__/*"
      - uses: actions/upload-artifact@v7
        with:
          name: svgwriter-inkscape
          path: ${{ runner.temp }}/svgwriter-inkscape.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/svgwriter-inkscape.zip" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
