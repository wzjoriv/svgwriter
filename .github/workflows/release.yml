name: Build and publish

# svgwriter is pure Python: one sdist and one universal wheel (skia-python, numpy and uharfbuzz bring
# their own binary wheels). Publishing uses the PYPI_API_TOKEN secret when set, otherwise PyPI
# trusted publishing (environment `pypi`).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check --strict dist/*
      - name: System libraries for skia
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 fonts-dejavu-core
      - name: Wheel installs and imports
        run: |
          python -m pip install dist/*.whl
          python -c "import svgwriter, pathlib; assert list(pathlib.Path(svgwriter.__file__).parent.glob('*.pyi')), 'stubs missing'"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
