[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysvgwriter"
dynamic = ["version"]
description = "SVG 1.1 as Python objects: draw, transform, combine, render and convert vector graphics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josue N Rivera" }]
dependencies = [
    "skia-python>=87",
    "numpy>=1.24",
    "uharfbuzz>=0.40",
]
keywords = ["svg", "vector", "graphics", "drawing", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Typing :: Typed",
]

[project.urls]
Homepage      = "https://github.com/wzjoriv/svgwriter"
Repository    = "https://github.com/wzjoriv/svgwriter"
Documentation = "https://wzjoriv.github.io/svgwriter"
"Bug Tracker" = "https://github.com/wzjoriv/svgwriter/issues"

[project.optional-dependencies]
office = [
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10",
]
plot = [
    "matplotlib>=3.7",
]
graph = [
    "networkx>=3.0",
]
math = [
    "ziamath>=0.11",
]
test = [
    "pysvgwriter[office,plot,graph,math]",
    "pytest>=7",
    "ezdxf>=1.0",
    "pillow>=10",
    "fonttools>=4.40",
]
dev = [
    "pysvgwriter[test,docs]",
    "stubpy",
    "pytest-cov",
    "ruff>=0.6",
    "typer>=0.12",
    "tomli; python_version < '3.11'",
    "nbformat",
    "nbclient",
    "ipykernel",
]

docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]

[project.scripts]
svgwriter = "svgwriter.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "svgwriter.__version__" }

[tool.setuptools.packages.find]
include = ["svgwriter*"]

[tool.setuptools.package-data]
svgwriter = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
include = ["svgwriter/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]
extend-exclude = ["build", "*.egg-info", "scripts/devkit", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["B008", "ANN"]
"examples/**/*.py" = ["B018"]  # a bare `doc` ends a notebook cell and shows the picture
"tests/**/*.py" = ["ANN", "UP006", "UP007", "UP035", "UP037", "UP045", "E701", "E702", "E741"]

[tool.devkit]
tools = ["svgwriter_tools:app"]

[tool.devkit.stub]
targets = ["svgwriter"]
output = "."

[tool.devkit.version]
file = "svgwriter/__init__.py"
tag = "{version}"

[tool.devkit.docs]
source = "docs"
out = "docs/_build/html"

[tool.devkit.check]
lint = ["svgwriter", "scripts", "tests", "examples"]
tests = ["-q", "-p", "no:cacheprovider"]
docs = "docs"

[tool.devkit.tiers]
default = "quick"
log_dir = "build/test-logs"

[tool.devkit.tiers.quick]
help = "The whole suite, quiet."
args = ["tests", "-q", "-p", "no:cacheprovider"]

[tool.devkit.tiers.cov]
help = "The whole suite with a coverage report."
args = ["tests", "-q", "--cov=svgwriter", "--cov-report=term-missing"]

[tool.devkit.notebooks]
source = "examples"
drop = ["image/png", "text/html"]

[tool.devkit.logo]
source = "examples.logo:logo"
variants = { dark = { theme = "dark" }, mono = { mono = true } }
output = "docs/_static/logo"
