[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svgwriter"
version = "2.0.0.dev0"
description = "Write, parse, compose and animate SVG 1.1 documents with an element-per-class object model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Josue N Rivera" }]
dependencies = ["skia-python>=87", "numpy>=1.24"]
keywords = ["svg", "vector", "graphics", "drawing", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7", "ezdxf>=1.0", "matplotlib>=3.7"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.6",
    "typer>=0.12",
    "tomli; python_version < '3.11'",
]

[project.scripts]
svgwriter = "svgwriter.__main__:main"

[tool.setuptools.packages.find]
include = ["svgwriter*"]

[tool.setuptools.package-data]
svgwriter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
include = ["svgwriter/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]
extend-exclude = ["build", "*.egg-info", "scripts/devkit", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["B008"]
"tests/**/*.py" = ["UP006", "UP007", "UP035", "UP037", "UP045", "E701", "E702", "E741"]

[tool.devkit]
tools = ["svgwriter_tools:app"]

[tool.devkit.check]
lint = ["svgwriter", "scripts", "tests", "examples"]
tests = ["-q", "-p", "no:cacheprovider"]

[tool.devkit.tiers]
default = "quick"
log_dir = "build/test-logs"

[tool.devkit.tiers.quick]
help = "The whole suite, quiet."
args = ["tests", "-q", "-p", "no:cacheprovider"]

[tool.devkit.tiers.cov]
help = "The whole suite with a coverage report."
args = ["tests", "-q", "--cov=svgwriter", "--cov-report=term-missing"]
