<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80" version="1.1">
  <style id="sb5d058-svgwriter-theme" type="text/css">.sb5d058-role-filter-shadow { flood-color:#1f2933;flood-opacity:0.2 }</style>
  <defs>
    <filter id="sb5d058-filter1" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="sb5d058-feGaussianBlur1" in="SourceAlpha" stdDeviation="2" result="feGaussianBlur1-out"/>
