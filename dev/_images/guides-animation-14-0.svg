<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" version="1.1">
  <style id="se77997-svgwriter-hover" type="text/css">#se77997-rect1:hover { fill:darkcyan !important;stroke:white !important;stroke-width:2 !important } #se77997-rect2:hover { opacity:0.9 !important }</style>
  <rect id="se77997-rect1" x="10" y="10" width="40" height="40" rx="6" fill="teal">
    <animateTransform attributeName="transform" values="30 30;30 30" additive="sum" begin="se77997-rect1.click" dur="0.3s" repeatCount="1" type="translate"/>
    <animateTransform attributeName="transform" values="1;1.1;1" additive="sum" begin="se77997-rect1.click" dur="0.3s" repeatCount="1" type="scale"/>
    <animateTransform attributeName="transform" values="-30 -30;-30 -30" additive="sum" begin="se77997-rect1.click" dur="0.3s" repeatCount="1" type="translate"/>
  </rect>
  <circle cx="150" cy="30" r="12" fill="gold" opacity="0.3">
    <animate attributeName="opacity" from="0" to="1" begin="se77997-rect1.mouseover" dur="0.4s" fill="freeze"/>
  </circle>
  <rect id="se77997-rect2" x="80" y="10" width="40" height="40" rx="6" fill="slateblue">
    <animateTransform attributeName="transform" from="0 0" to="0 -6" additive="sum" begin="se77997-rect2.click" dur="0.15s" fill="freeze" type="translate"/>
  </rect>
</svg>
