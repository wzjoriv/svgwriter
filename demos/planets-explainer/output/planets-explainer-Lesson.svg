<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" version="1.1">
  <style id="svgwriter-theme" type="text/css">.role-background { fill:#05060f;stroke:none }
.role-text { fill:#e6e9f5;stroke:none;font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:20px;font-weight:400 }
.role-title { fill:#ffd166;stroke:none;font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:64px;font-weight:700 }
.role-subtitle { fill:#8a91b4;stroke:none;font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:26px;font-weight:400 }</style>
  <rect x="0" y="0" width="1280" height="720" class="role-background"/>
  <g transform="translate(80 160)">
    <text class="role-title" transform="translate(0 62)">The Solar System</text>
    <text class="role-subtitle" transform="translate(0 112.625)">Science, lesson 4: distances and sizes</text>
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>
  </g>
  <text x="80" y="340" style="font-size:36" class="role-subtitle">Today we will learn</text>
  <text x="100" y="410" style="font-size:32" class="role-text" opacity="0">•  How far the planets are from the Sun<animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/></text>
  <text x="100" y="474" style="font-size:32" class="role-text" opacity="0">•  How big the Sun is next to another star<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/></text>
  <text x="100" y="538" style="font-size:32" class="role-text" opacity="0">•  Why scale models help us compare<animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.6s" fill="freeze"/></text>
</svg>
