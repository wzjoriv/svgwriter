# The poster's look, sized in millimetres because the page is drawn in millimetres.
name = "tide-atlas"
extends = "print"

[palette]
background = "#f6f1e7"     # paper
foreground = "#1d2a33"
muted = "#5d6b73"
primary = "#14506b"        # deep water
secondary = "#e2703a"      # the route
accent = "#f2c14e"
border = "#c9bfae"

[fonts]
family = "Helvetica, Arial, sans-serif"

[fonts.sizes]
title = 30
subtitle = 5.2
text = 4
caption = 3

[roles.route]
fill = "none"
stroke = "{palette.secondary}"
stroke-width = 0.8
stroke-dasharray = "2.4 1.6"
stroke-linecap = "round"

[roles.pattern]
fill = "{palette.primary}"
