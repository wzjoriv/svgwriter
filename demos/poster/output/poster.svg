  <text x="16" y="50" style="font-style:italic;font-family:Times New Roman" class="role-title">Beach Clean-Up</text>
  <text x="17" y="62" style="fill:#ffffff;font-family:Arial" class="role-subtitle">Help keep our coast clean. All ages welcome.</text>
