# The project: `svgwriter build` writes every output below into output/, `svgwriter preview` shows them live.
[project]
name = "{{ project_name }}"
entry = "main:build"      # module:function that draws into a document of this size and theme
size = "a4"               # millimetres: the drawing's coordinates are mm; try "a3", "letter" or "a4-landscape"
theme = "theme.toml"

[outputs]
formats = ["pdf", "svg", "png"]
png = { dpi = 150 }       # print resolution for the preview image

# `svgwriter preview` settings; every key is optional and shown at its default.
# [preview]
# pages = ["name", "name-Scene"]  # pages and scenes to show, in order (default: all)
# background = "checker"          # "checker", "light", "dark" or a colour
# layout = "auto"                 # controls on the "right", at the "bottom", or "auto"
# fit = "contain"                 # scale the drawing to fit, or "actual" size
# port = 8000
# open = true                     # open a browser on start
# debounce_ms = 80                # pause after a control moves before redrawing
# build_on_save = true            # write the outputs after a save
# formats_on_build = ["svg"]      # what saves and Build outputs write (default: [outputs] formats)
